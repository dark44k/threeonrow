<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e86a33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Всё спокойно">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Всё спокойно</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
  <main class="app">
    <header class="hud">
      <div class="stat"><small>Ходы</small><b id="moves">0</b></div>
      <h1 id="levelName">…</h1>
      <div class="stat"><small>Очки</small><b id="score">0</b></div>
    </header>

    <button class="hint-toggle" id="btnHint" aria-expanded="false">💡 Подсказка</button>
    <section class="chain" id="chain" hidden></section>

    <div class="board" id="board"></div>

    <div class="log" id="log"></div>

    <nav class="controls">
      <button id="btnLevels">Уровни</button>
      <button id="btnRestart">Заново</button>
      <button id="btnRules">Цепочка</button>
      <button id="btnDebug" title="Клавиша D">Debug</button>
    </nav>
  </main>

  <pre class="debug" id="debug" hidden></pre>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
